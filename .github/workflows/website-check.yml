name: Website File Check

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v7

      - name: Check index.html
        run: test -f index.html

      - name: Check README.md
        run: test -f README.md

      - name: Print success message
        run: echo "Required files are present"
